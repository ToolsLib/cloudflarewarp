services:
  traefik:
    image: traefik:v3.8.0@sha256:00c9734983e74ae35a1fc18eaee9e9da13f3dde95c4e45b3b8c3b60e0dbd2d17
    command:
      - --global.checknewversion=false
      - --global.sendanonymoususage=false
      - --entrypoints.web.address=:8000
      - --providers.file.directory=/etc/traefik/dynamic
      - --providers.file.watch=false
      - --experimental.localplugins.cloudflarewarp.modulename=github.com/BetterCorp/cloudflarewarp
      - --accesslog=true
    volumes:
      - ../:/plugins-local/src/github.com/BetterCorp/cloudflarewarp:ro
      - ./config/smoke.${TEST_CONFIG_FORMAT:?set TEST_CONFIG_FORMAT}:/etc/traefik/dynamic/smoke.${TEST_CONFIG_FORMAT}:ro

  whoami:
    image: traefik/whoami:v1.12.0@sha256:c4717a8d1f0134a7444e24f881160e033991f23027c6c5a9a3f8fd22e70d1d44
